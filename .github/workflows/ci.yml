name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      # CODEAI_WEB_URL and CODEAI_API_URL are overridden for CI below
      CLI_CONFIG_DIR: ${{ vars.CLI_CONFIG_DIR }}
      CLI_TIMEOUT: ${{ vars.CLI_TIMEOUT }}
      HTTP_TIMEOUT: ${{ vars.HTTP_TIMEOUT }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES }}
      # CI safety overrides for E2E tests
      E2E_TIMEOUT: '2000'
      # Force tests to target localhost and ensure no real API key is present
      CODEAI_WEB_URL: 'http://localhost:3000'
      CODEAI_API_URL: 'http://localhost:5001/codex-ai-30da8/us-central1'
      CODEAI_API_KEY: ''
      RUN_REAL_E2E: 'false'
    strategy:
      matrix:
        node-version: [22.18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use variables
        run: |
          echo "CODEAI_API_URL variable : $CODEAI_API_URL"
          echo "CODEAI_WEB_URL variable : $CODEAI_WEB_URL"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: |
          # increase npm fetch retries and backoff to reduce E429 failures
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 2000
          # prefer offline/cached install and retry on failure
          npm ci --prefer-offline --no-audit || (
            echo "First install failed; retrying with exponential backoff..."
            n=0
            until [ $n -ge 4 ]; do
              sleep $((2 ** n))
              npm ci --prefer-offline --no-audit && break
              n=$((n + 1))
            done
          )

      - name: Run type checking
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test -- --silent
